name: Manual verified Pages release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment environment
        required: true
        type: choice
        options:
          - preview
          - production
      expected_release_id:
        description: Approved release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: ${{ inputs.target == 'preview' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      source_revision: ${{ steps.identity.outputs.source_revision }}
      release_id: ${{ steps.identity.outputs.release_id }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact npm and dependencies
        run: |
          npm install --global npm@11.16.0
          npm run verify:toolchain
          npm ci
      - name: Validate approved public source
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_TARGET" = production ] && [ "$SOURCE_BRANCH" != master ]; then
            echo "Production requires master." >&2
            exit 1
          fi
          if [ "$RELEASE_TARGET" = preview ] && [ "$SOURCE_BRANCH" = integration/portfolio-hardening-2026-07 ]; then
            echo "Preview refuses the internal integration lineage." >&2
            exit 1
          fi
          npm run verify:public-release-lineage -- --require-release-commit
      - name: Prepare checksum-pinned KoSIT cache
        env:
          KOSIT_ALLOW_DOWNLOAD: '1'
        run: npm run setup:xrechnung:kosit:download -- --confirm-download
      - name: Prepare checksum-pinned Firefox runtime
        run: npm run setup:firefox:release
      - name: Run complete release gate and build verified artifact once
        run: npm run verify:release-candidate
      - id: identity
        name: Verify requested identity
        env:
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
        run: node scripts/release/workflow-artifact.mjs prepare "$EXPECTED_RELEASE_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: .artifacts/release-candidate/transfer
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: .artifacts/release-candidate/transfer
      - name: Fail closed on release and remote ownership prerequisites
        env:
          DEPLOYMENT_OWNER: ${{ vars.DEPLOYMENT_OWNER }}
          CLOUDFLARE_GIT_INTEGRATION_DISABLED: ${{ vars.CLOUDFLARE_GIT_INTEGRATION_DISABLED }}
          EXPECTED_RELEASE_ID: ${{ needs.quality.outputs.release_id }}
          EXPECTED_SOURCE_REVISION: ${{ needs.quality.outputs.source_revision }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.quality.outputs.artifact_digest }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release/workflow-artifact.mjs consume
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: pages deploy .artifacts/release-candidate/transfer/deploy --project-name portfolio-astro --branch ${{ inputs.target == 'production' && 'master' || 'preview' }}
