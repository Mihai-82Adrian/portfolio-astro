name: Release candidate quality

on:
  pull_request:
  push:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.value }}
    steps:
      - id: ref
        env:
          RAW_REF: ${{ github.ref }}
        run: |
          normalized="$(printf '%s' "$RAW_REF" | tr -c 'A-Za-z0-9._-' '-')"
          printf 'value=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality Checks
    needs: normalize-ref
    runs-on: ubuntu-latest
    concurrency:
      group: quality-${{ needs.normalize-ref.outputs.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact npm
        run: npm install --global npm@11.17.0
      - name: Verify exact toolchain
        run: npm run verify:toolchain
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare checksum-pinned KoSIT cache
        env:
          KOSIT_ALLOW_DOWNLOAD: '1'
        run: npm run setup:xrechnung:kosit:download -- --confirm-download
      - name: Prepare checksum-pinned Firefox runtime
        run: npm run setup:firefox:release
      - name: Run proportional Quality Checks
        env:
          RELEASE_DIFF_BASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.before) || '' }}
        run: npm run ci:quality-gate
