version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Phase 3-C / Phase 4 release freeze lifted (Phase 4 controlled production release complete,
    # 2026-08-09; see docs/operations/dependency-hygiene.md). Routine version-update PRs resume at
    # the pre-freeze limit. Dependabot security alerts and security-update PRs remain enabled
    # separately and were never limited by this freeze.
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - security
    groups:
      framework-runtime:
        patterns:
          - astro
          - "@astrojs/*"
          - svelte
      security-sensitive:
        patterns:
          - wrangler
          - dompurify
          - marked
          - katex
          - rehype-katex

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Phase 3-C / Phase 4 release freeze lifted (Phase 4 controlled production release complete,
    # 2026-08-09; see docs/operations/dependency-hygiene.md). Routine version-update PRs resume at
    # the pre-freeze limit. Dependabot security alerts and security-update PRs remain enabled
    # separately and were never limited by this freeze.
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
