version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Phase 3-C / Phase 4 release freeze: routine version-update PRs are paused.
    # Dependabot security alerts and security-update PRs remain enabled separately.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      framework-runtime:
        patterns:
          - astro
          - "@astrojs/*"
          - svelte
      security-sensitive:
        patterns:
          - wrangler
          - dompurify
          - marked
          - katex
          - rehype-katex

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Phase 3-C / Phase 4 release freeze: routine version-update PRs are paused.
    # Dependabot security alerts and security-update PRs remain enabled separately.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
